name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump applied to the latest release tag
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Only print the version and changelog, do not open a release PR
        type: boolean
        default: false
  pull_request:
    types: [closed]
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG_PREFIX: FTPauto-v

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 0

      - name: Determine versions
        id: version
        run: |
          prev_tag=$(git tag --list "${TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)
          prev_version="${prev_tag#"$TAG_PREFIX"}"
          if [[ -z "$prev_tag" ]]; then
            echo "No previous release tag found" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$prev_version"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_version="$major.$minor.$patch"
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "new_tag=${TAG_PREFIX}${new_version}" >> "$GITHUB_OUTPUT"
          echo "Releasing $prev_tag -> ${TAG_PREFIX}${new_version}"

      - name: Generate changelog
        run: |
          bash .github/scripts/changelog.sh "${{ steps.version.outputs.prev_tag }}" "${{ steps.version.outputs.new_version }}" > release_notes.md
          cat release_notes.md

      - name: Bump version and update CHANGELOG.md
        if: ${{ !inputs.dry_run }}
        run: |
          new_version="${{ steps.version.outputs.new_version }}"
          # install.sh reads the installed version from line 2 of ftpauto.sh
          sed -i -E "2s/^s_version=\".*\"/s_version=\"${new_version}\"/" ftpauto.sh
          grep -q "^s_version=\"${new_version}\"" <(sed -n 2p ftpauto.sh)
          {
            echo "# Changelog"
            echo
            cat release_notes.md
            if [[ -f CHANGELOG.md ]]; then
              echo
              tail -n +3 CHANGELOG.md
            fi
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

      - name: Open release PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.new_tag }}"
          branch="release/${tag}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add ftpauto.sh CHANGELOG.md
          git commit -m "Release ${tag}"
          git push origin "$branch"
          # The PR body is the release notes; the publish job reuses it for the GitHub release
          gh pr create --base master --head "$branch" \
            --title "Release ${tag}" --body-file release_notes.md

  publish:
    # Only for merged release PRs from branches of this repository
    if: >-
      ${{ github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'release/FTPauto-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine tag
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          tag="${HEAD_REF#release/}"
          version="${tag#"$TAG_PREFIX"}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release branch: $HEAD_REF" >&2
            exit 1
          fi
          # Guard against a release PR that did not actually bump the version
          grep -q "^s_version=\"${version}\"" <(sed -n 2p ftpauto.sh)
          printf '%s\n' "$PR_BODY" > release_notes.md
          echo "new_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "new_version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag release
        run: |
          tag="${{ steps.version.outputs.new_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release ${tag}"
          git push origin "$tag"

      - name: Build source archive
        run: |
          tag="${{ steps.version.outputs.new_tag }}"
          # Single top-level directory so install.sh can extract with --strip-components 1
          git archive --format=tar.gz --prefix="${tag}/" -o "${tag}.tar.gz" "$tag"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.new_tag }}"
          gh release create "$tag" "${tag}.tar.gz" \
            --title "FTPauto v${{ steps.version.outputs.new_version }}" \
            --notes-file release_notes.md \
            --verify-tag